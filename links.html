<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCO | Brindes e Acessórios Corporativos</title>
<meta name="description" content="ARCO, Artesanato e Representação Corporativa. Brindes e acessórios corporativos artesanais em Moçambique.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#14264a;--navy2:#0d1b36;--gold:#bd963f;--gold-light:#dfc27f;--paper:#f7f6f2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Jost',Arial,sans-serif;background:linear-gradient(160deg,var(--navy2),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh}
main{width:100%;max-width:420px;text-align:center}
.brand{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:4rem;letter-spacing:.28em;margin:0 0 0 .28em;line-height:1}
.sub{color:var(--gold-light);text-transform:uppercase;letter-spacing:.22em;font-size:.7rem;font-weight:500;margin:10px 0 0}
.line{width:64px;height:2px;background:var(--gold);margin:26px auto}
.lead{color:#d6dbe6;font-size:1rem;line-height:1.6;margin:0 0 30px}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:17px 20px;margin-bottom:14px;border:1px solid var(--gold);text-decoration:none;font-size:1.05rem;font-weight:600;letter-spacing:.04em;transition:.2s}
.btn svg{width:22px;height:22px;flex:none}
.btn.primary{background:var(--gold);color:var(--navy2)}
.btn.primary:hover,.btn.primary:focus-visible{background:#d0ad60}
.btn.outline{background:transparent;color:#fff;border-color:#a9b1c1}
.btn.outline:hover,.btn.outline:focus-visible{background:#fff;color:var(--navy)}
.btn:focus-visible{outline:3px solid var(--gold-light);outline-offset:3px}
.foot{margin-top:30px;color:#9fa9bd;font-size:.82rem}
</style>
</head>
<body>
<main>
  <h1 class="brand">ARCO</h1>
  <p class="sub">Brindes &amp; Acessórios Corporativos</p>
  <div class="line" aria-hidden="true"></div>
  <p class="lead">Artesanato e Representação Corporativa.<br>Escolha como quer falar connosco.</p>

  <a class="btn primary" href="https://arcocorporativo-mz.github.io/arco/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    Ver o nosso site
  </a>

  <a class="btn outline" href="https://www.instagram.com/arcocorporativo.mz" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
    Instagram @arcocorporativo.mz
  </a>

  <p class="foot">Maputo e Macia · Moçambique</p>
</main>
</body>
</html>
